# Which prepared conversations a run uses.
# Read by scripts/prepare_data.py (opening_turns) and by every experiment run (the rest).

seeds_path: data/processed/seeds.jsonl    # openings the agents continue
labels_path: data/processed/labels.jsonl  # real outcomes, read only when comparing results

# Real comments kept per opening. Openings always stop before the first personal attack.
# Re-run scripts/prepare_data.py after changing this.
opening_turns: 3

# Skip openings shorter than this. Because openings stop before the first attack, short
# openings are mostly attack conversations, which would make length give the label away.
min_opening_turns: 3

# CGA source splits to draw from: train, val, test.
splits: [test]

# Only use conversations whose label the dataset authors double-checked.
verified_only: false

# Conversations per run; null keeps every conversation that passes the filters.
# Must be even when keep_pairs is true.
sample_size: 20

# Keep each attack conversation together with its matched civil conversation, so a run
# always has as many real 1s as real 0s.
keep_pairs: true

# Same seed, same sample.
random_seed: 544
