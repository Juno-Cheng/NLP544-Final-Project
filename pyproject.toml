[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trustsim"
version = "0.2.0"
description = "Static vs dynamic trust personas on CGA-WIKI openings, scored by a blind judge."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai==3.35.1",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
data = ["convokit==4.1.2"]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.ruff.lint.isort]
known-local-folder = ["helpers"]
